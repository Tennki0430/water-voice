<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fc3f2"/>
      <stop offset="0.55" stop-color="#3b9ad9"/>
      <stop offset="1" stop-color="#155a8a"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f6ff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0a3a5c" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- squircle background -->
  <rect x="92" y="92" width="840" height="840" rx="190" fill="url(#g)"/>
  <!-- subtle top sheen -->
  <rect x="92" y="92" width="840" height="420" rx="190" fill="#ffffff" opacity="0.08"/>

  <!-- water drop -->
  <g filter="url(#sh)">
    <path d="M512 250
             C 512 250, 700 470, 700 612
             A 188 188 0 1 1 324 612
             C 324 470, 512 250, 512 250 Z"
          fill="url(#drop)"/>
  </g>

  <!-- voice waveform inside the drop -->
  <g fill="#3b9ad9">
    <rect x="430" y="600" width="20" height="64" rx="10"/>
    <rect x="466" y="566" width="20" height="132" rx="10"/>
    <rect x="502" y="540" width="20" height="184" rx="10"/>
    <rect x="538" y="572" width="20" height="120" rx="10"/>
    <rect x="574" y="606" width="20" height="52" rx="10"/>
  </g>
</svg>
